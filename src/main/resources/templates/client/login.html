<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f8f8; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 300px; }
        h1 { text-align: center; color: #ff69b4; border-bottom: 2px solid #ff69b4; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-login { background-color: #ff69b4; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.1em; }
        .btn-login:hover { background-color: #ff4794; }
        .message-success { color: green; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .message-error { color: red; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .register-link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Đăng nhập</h1>
        
        <div th:if="${param.registerSuccess}" class="message-success">
            Đăng ký thành công! Vui lòng đăng nhập.
        </div>
        
        <div th:if="${param.error}" class="message-error">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        
        <form th:action="@{/perform_login}" method="post">
            <div class="form-group">
                <label for="username">Tên đăng nhập:</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" required />
            </div>
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="register-link">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>
</body>
</html>
