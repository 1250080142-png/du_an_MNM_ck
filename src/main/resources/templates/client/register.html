<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tài khoản</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f8f8; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .register-container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 400px; }
        h1 { text-align: center; color: #ff69b4; border-bottom: 2px solid #ff69b4; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-register { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.1em; }
        .btn-register:hover { background-color: #45a049; }
        .message-error { color: red; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .login-link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Đăng ký Tài khoản</h1>
        
        <div th:if="${registerError}" class="message-error">
            <span th:text="${registerError}"></span>
        </div>
        
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="username">Tên đăng nhập:</label>
                <input type="text" id="username" th:field="*{username}" required />
            </div>
            <div class="form-group">
                <label for="passwordHash">Mật khẩu:</label>
                <input type="password" id="passwordHash" th:field="*{passwordHash}" required />
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>
            <div class="form-group">
                <label for="phone">Số điện thoại (tùy chọn):</label>
                <input type="text" id="phone" th:field="*{phone}" />
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ (tùy chọn):</label>
                <input type="text" id="address" th:field="*{address}" />
            </div>
            
            <button type="submit" class="btn-register">Đăng ký</button>
        </form>

        <div class="login-link">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
