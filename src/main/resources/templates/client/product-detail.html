<!DOCTYPE html>
<html lang="en" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - Cosmetic Shop'"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pink-main: #f06292;
            --pink-hover: #d81b60;
            --price-red: #d9534f;
            --text-dark: #333;
            --text-gray: #666;
            --bg-body: #f8f9fa;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: var(--bg-body); 
            color: var(--text-dark);
            padding: 40px 20px;
        }

        /* --- Container chính --- */
        .main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }

        .container { 
            display: flex; 
            gap: 50px; 
            background-color: #fff; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            align-items: flex-start;
        }

        /* --- Hình ảnh --- */
        .product-image { flex: 1; }
        .product-image img { 
            width: 100%; 
            height: auto; 
            border-radius: 15px; 
            border: 1px solid #f0f0f0;
            transition: transform 0.3s ease;
        }
        .product-image img:hover { transform: scale(1.02); }

        /* --- Chi tiết thông tin --- */
        .product-details { flex: 1.2; }
        
        h1 { 
            font-size: 2.2rem; 
            color: var(--text-dark); 
            margin: 0 0 10px 0; 
            line-height: 1.2;
        }

        .category-tag {
            display: inline-block;
            background: #fce4ec;
            color: var(--pink-main);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .price { 
            font-size: 2.5rem; 
            color: var(--price-red); 
            font-weight: 800; 
            margin: 20px 0; 
        }

        .status-badge {
            font-size: 0.95rem;
            margin-bottom: 25px;
            padding: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .description-box { 
            margin-top: 30px; 
            padding: 20px; 
            background-color: #fff9fb;
            border-radius: 12px;
            border-left: 5px solid var(--pink-main);
        }
        .description-box h2 { 
            font-size: 1rem; 
            text-transform: uppercase; 
            color: var(--text-dark); 
            margin-top: 0;
        }
        .description-box p { color: var(--text-gray); line-height: 1.8; margin-bottom: 0; }

        /* --- Form Thêm vào giỏ --- */
        .add-to-cart-form {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .add-to-cart-form input[type="number"] { 
            padding: 12px; 
            width: 70px; 
            text-align: center; 
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .btn-add { 
            background: linear-gradient(135deg, #f06292, #d81b60); 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.3);
        }
        .btn-add:hover { 
            background: linear-gradient(135deg, #d81b60, #ad1457); 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(240, 98, 146, 0.4);
        }

        .auth-notice { font-style: italic; color: #888; margin-left: 10px; }

        /* --- Links phía dưới --- */
        .footer-nav {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-top: 1px solid #ddd;
        }
        .footer-nav a { text-decoration: none; color: var(--text-gray); font-weight: 500; transition: 0.2s; }
        .footer-nav a:hover { color: var(--pink-main); }

        /* Responsive */
        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 20px; }
            .product-image { max-width: 100%; }
            .add-to-cart-form { flex-direction: column; align-items: flex-start; }
            .btn-add { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <div class="product-image">
                <div th:if="${product.imageUrl != null}">
                    <img th:src="@{${product.imageUrl}}" alt="Ảnh sản phẩm">
                </div>
                <div th:unless="${product.imageUrl != null}">
                     <img src="https://via.placeholder.com/400x400?text=No+Image" alt="Không có ảnh">
                </div>
            </div>

            <div class="product-details">
                <span class="category-tag" th:text="${product.category.name}">Danh mục</span>
                
                <h1 th:text="${product.name}">Tên Sản phẩm</h1>
                
                <div class="price">
                    <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span> <small style="font-size: 1.5rem">VND</small>
                </div>

                <div class="status-badge">
                    <i class="fa fa-circle" th:style="${product.stockQuantity > 0 ? 'color: #27ae60' : 'color: #d9534f'}"></i>
                    <span th:if="${product.stockQuantity > 0}">
                        Trạng thái: <strong style="color: #27ae60;">Còn hàng (<span th:text="${product.stockQuantity}"></span>)</strong>
                    </span>
                    <span th:if="${product.stockQuantity <= 0}">
                        Trạng thái: <strong style="color: #d9534f;">Hết hàng</strong>
                    </span>
                </div>

                <div class="description-box">
                    <h2><i class="fa fa-align-left"></i> Mô tả sản phẩm</h2>
                    <p th:text="${product.description}">Mô tả chi tiết sản phẩm.</p>
                </div>
                
                <div th:if="${product.stockQuantity > 0}">
                    <form th:action="@{/cart/add}" method="post" class="add-to-cart-form">
                        <input type="hidden" name="productId" th:value="${product.id}" /> 
                        
                        <div class="quantity-control">
                            <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQuantity}" required />
                        </div>
                        
                        <button type="submit" class="btn-add" sec:authorize="isAuthenticated()">
                            <i class="fa fa-shopping-cart"></i> THÊM VÀO GIỎ
                        </button>
                        
                        <span sec:authorize="!isAuthenticated()" class="auth-notice">
                            (Vui lòng <a th:href="@{/login}" style="color: var(--pink-main)">Đăng nhập</a> để mua hàng)
                        </span>
                    </form>
                </div>
            </div>
        </div>

        <div class="footer-nav">
            <a th:href="@{/}" class="back-link"><i class="fa fa-arrow-left"></i> Quay lại Trang chủ</a>
            
            <div class="nav-links">
                <a th:href="@{/cart}" sec:authorize="isAuthenticated()"><i class="fa fa-shopping-bag"></i> Giỏ hàng</a> 
                <span sec:authorize="isAuthenticated()"> | </span>
                <a th:href="@{/admin/products}" sec:authorize="hasRole('ADMIN')"><i class="fa fa-user-shield"></i> Khu vực Admin</a>
            </div>
        </div>
    </div>

</body>
</html>
