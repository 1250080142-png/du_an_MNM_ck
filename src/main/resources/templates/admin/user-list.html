<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout :: main-layout(~{::section})}">
<body>
<section>
    <div style="font-family: 'Segoe UI', Arial, sans-serif; padding: 20px;">
        <div style="background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); padding: 30px;">
            
            <div style="margin-bottom: 25px;">
                <h2 style="color: #333; margin: 0; display: flex; align-items: center; gap: 12px;">
                    <i class="fas fa-users-cog" style="color: #e91e63;"></i> Quản lý người dùng
                </h2>
                <p style="color: #888; margin: 5px 0 0 0;">Quản lý quyền truy cập và trạng thái hoạt động của thành viên.</p>
            </div>

            <!-- Thông báo thành công -->
            <div th:if="${successMessage}" style="padding: 15px; background: #e6fffa; color: #2d6a4f; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #38b2ac;">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
            </div>

            <!-- Thông báo lỗi -->
            <div th:if="${errorMessage}" style="padding: 15px; background: #fff5f5; color: #e53e3e; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #e53e3e;">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
            </div>

            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 2px solid #f8f9fa; color: #999; font-size: 13px;">
                        <th style="padding: 15px;">THÔNG TIN USER</th>
                        <th style="padding: 15px;">EMAIL</th>
                        <th style="padding: 15px; text-align: center;">VAI TRÒ</th>
                        <th style="padding: 15px; text-align: center;">TRẠNG THÁI</th>
                        <th style="padding: 15px; text-align: right;">HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}" style="border-bottom: 1px solid #fbfbfb;">
                        <td style="padding: 15px;">
                            <div style="font-weight: 600; color: #333;" th:text="${u.username}"></div>
                            <small style="color: #aaa;" th:text="'ID: #' + ${u.id}"></small>
                        </td>
                        <td style="padding: 15px; color: #666;" th:text="${u.email}"></td>
                        
                        <!-- Cập nhật Role -->
                        <td style="padding: 15px; text-align: center;">
                            <form th:action="@{/admin/users/update-role}" method="post">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <select name="role" onchange="this.form.submit()" 
                                        style="padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; cursor: pointer;">
                                    <option value="USER" th:selected="${u.role == 'USER'}">Khách hàng</option>
                                    <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">Quản trị viên</option>
                                </select>
                            </form>
                        </td>

                        <!-- Trạng thái -->
                        <td style="padding: 15px; text-align: center;">
                            <span th:style="${u.enabled} ? 'color: #38a169; background: #f0fff4; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;' : 'color: #e53e3e; background: #fff5f5; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;'"
                                  th:text="${u.enabled ? 'Đang hoạt động' : 'Đang bị khóa'}">
                            </span>
                        </td>

                        <!-- Hành động khóa/mở -->
                        <td style="padding: 15px; text-align: right;">
                            <form th:action="@{/admin/users/toggle-status}" method="post" style="display: inline-block;">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <button type="submit" 
                                        th:style="${u.enabled} ? 'background: #2d3436; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px;' : 'background: #e91e63; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px;'">
                                    <i th:class="${u.enabled ? 'fas fa-user-slash' : 'fas fa-user-check'}"></i>
                                    <span th:text="${u.enabled ? ' Khóa' : ' Mở khóa'}"></span>
                                </button>
                            </form>
                            
                            <!-- Nút xóa -->
                            <a th:href="@{'/admin/users/delete/' + ${u.id}}" 
                               onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?')"
                               style="margin-left: 8px; color: #888; text-decoration: none; font-size: 14px;">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
