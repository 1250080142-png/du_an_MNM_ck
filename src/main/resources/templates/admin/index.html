<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: main-layout(~{::section})}">
<body>
    <section>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px;">
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div><p style="font-size: 0.8rem; color: #888; font-weight: bold;">SẢN PHẨM</p><h2 th:text="${productCount}">0</h2></div>
                <i class="fas fa-box-open fa-2x" style="color: #f8bbd0;"></i>
            </div>
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div><p style="font-size: 0.8rem; color: #888; font-weight: bold;">ĐƠN HÀNG MỚI</p><h2 th:text="${orderCount}">12</h2></div>
                <i class="fas fa-shopping-bag fa-2x" style="color: #f8bbd0;"></i>
            </div>
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div><p style="font-size: 0.8rem; color: #888; font-weight: bold;">NGƯỜI DÙNG</p><h2 th:text="${userCount}">0</h2></div>
                <i class="fas fa-user-friends fa-2x" style="color: #f8bbd0;"></i>
            </div>
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div><p style="font-size: 0.8rem; color: #888; font-weight: bold;">DOANH THU</p><h2 style="font-size: 1.2rem;">15.200.000đ</h2></div>
                <i class="fas fa-dollar-sign fa-2x" style="color: #f8bbd0;"></i>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <div class="card">
                <h3 style="font-size: 1rem; margin-bottom: 20px;"><i class="fas fa-history"></i> Đơn hàng gần đây</h3>
                <div style="text-align: center; padding: 40px; color: #999;">
                    <p>Chưa có dữ liệu đơn hàng mới để hiển thị.</p>
                </div>
            </div>

            <div class="card">
                <h3 style="font-size: 1rem; margin-bottom: 20px;"><i class="fas fa-bolt"></i> Thao tác nhanh</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <a th:href="@{/admin/products/add}" style="background: #f06292; color: white; text-decoration: none; padding: 12px; border-radius: 5px; text-align: center; font-weight: bold;">
                        + Thêm sản phẩm mới
                    </a>
                    <a href="#" style="background: #3498db; color: white; text-decoration: none; padding: 12px; border-radius: 5px; text-align: center; font-weight: bold;">
                        + Tạo danh mục mới
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
