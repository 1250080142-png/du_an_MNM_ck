<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout :: main-layout(~{::section})}">
<body>
<section>
    <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px;">
        
        <div style="background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); padding: 30px;">
            
            <!-- Tiêu đề trang -->
            <div style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="color: #333; margin: 0; display: flex; align-items: center; gap: 12px;">
                        <i class="fas fa-boxes" style="color: #e91e63;"></i> Quản lý kho hàng
                    </h2>
                    <p style="color: #888; margin: 5px 0 0 0;">Cập nhật nhanh số lượng sản phẩm khi nhập kho.</p>
                </div>
            </div>

            <!-- Thông báo phản hồi từ Controller -->
            <div th:if="${successMessage}" 
                 style="padding: 15px; background: #e6fffa; color: #2d6a4f; border-left: 5px solid #38b2ac; border-radius: 8px; margin-bottom: 20px; font-weight: 500;">
                <i class="fas fa-check-circle" style="margin-right: 8px;"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${errorMessage}" 
                 style="padding: 15px; background: #fff5f5; color: #c53030; border-left: 5px solid #f56565; border-radius: 8px; margin-bottom: 20px; font-weight: 500;">
                <i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <hr style="border: none; border-top: 1px solid #f0f0f0; margin-bottom: 25px;">

            <!-- Bảng quản lý -->
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 2px solid #f8f9fa;">
                            <th style="padding: 15px; color: #999; font-size: 13px; font-weight: 600;">SẢN PHẨM</th>
                            <th style="padding: 15px; color: #999; font-size: 13px; font-weight: 600; text-align: center;">ẢNH</th>
                            <th style="padding: 15px; color: #999; font-size: 13px; font-weight: 600; text-align: center;">TỒN KHO HIỆN TẠI</th>
                            <th style="padding: 15px; color: #999; font-size: 13px; font-weight: 600; text-align: right;">NHẬP THÊM SỐ LƯỢNG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}" style="border-bottom: 1px solid #fbfbfb; transition: all 0.3s;">
                            <!-- Thông tin tên -->
                            <td style="padding: 15px;">
                                <div style="font-weight: 600; color: #2d3436; font-size: 15px;" th:text="${p.name}"></div>
                                <span style="font-size: 11px; background: #f1f2f6; color: #747d8c; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block;">
                                    SKU: <span th:text="${p.id}"></span>
                                </span>
                            </td>

                            <!-- Ảnh minh họa -->
                           <!-- Tìm đến phần hiển thị ảnh và thay thế bằng đoạn này -->
								<td style="padding: 15px;">
								    <img th:if="${p.imageUrl != null and p.imageUrl != ''}" 
								         th:src="${#strings.startsWith(p.imageUrl, '/images/')} ? @{${p.imageUrl}} : @{'/images/' + ${p.imageUrl}}" 
								         style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">
								    
								    <img th:unless="${p.imageUrl != null and p.imageUrl != ''}" 
								         th:src="@{/images/no-image.png}" 
								         style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">
								</td>
                            <!-- Số lượng hiện có (Có badge màu) -->
                            <td style="padding: 15px; text-align: center;">
                                <div th:with="stock=${p.stockQuantity != null ? p.stockQuantity : 0}"
                                     th:style="'display: inline-block; min-width: 45px; padding: 6px 12px; border-radius: 8px; font-weight: 700; ' + 
                                               (${stock <= 5} ? 'background: #fff5f5; color: #e53e3e; border: 1px solid #feb2b2;' : 'background: #f0fff4; color: #38a169; border: 1px solid #c6f6d5;')"
                                     th:text="${stock}">
                                </div>
                            </td>

                            <!-- Form cộng dồn số lượng -->
                            <td style="padding: 15px; text-align: right;">
                                <form th:action="@{/admin/inventory/add-stock}" method="post" 
                                      style="display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
                                    <input type="hidden" name="productId" th:value="${p.id}">
                                    
                                    <div style="display: flex; align-items: center; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 2px 8px;">
                                        <span style="color: #aaa; font-size: 14px; font-weight: bold; margin-right: 5px;">+</span>
                                        <input type="number" name="quantity" value="1" min="1" 
                                               style="width: 60px; border: none; background: transparent; padding: 8px 5px; outline: none; font-weight: 600; text-align: center;">
                                    </div>

                                    <button type="submit" 
                                            style="background: #e91e63; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.2);"
                                            onmouseover="this.style.background='#d81b60'; this.style.transform='translateY(-2px)'"
                                            onmouseout="this.style.background='#e91e63'; this.style.transform='translateY(0)'">
                                        <i class="fas fa-plus-circle"></i> Cập nhật
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</section>
</body>
</html>
