<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout :: main-layout(~{::section})}">
<body>
<section>
    <style>
        /* CSS nội bộ để làm đẹp nhanh */
        .admin-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .custom-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .custom-input {
            border: 2px solid #eee;
            padding: 10px 15px;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
            width: 300px;
        }
        .custom-input:focus { border-color: #f06292; }
        .btn-add {
            background: #f06292;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-add:hover { background: #e91e63; transform: translateY(-2px); }
        
        /* Style Table */
        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 15px;
        }
        .custom-table thead th {
            background: #2c3e50;
            color: white;
            padding: 15px;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .custom-table thead th:first-child { border-radius: 8px 0 0 8px; }
        .custom-table thead th:last-child { border-radius: 0 8px 8px 0; }
        
        .custom-table tbody tr {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .custom-table tbody tr:hover { transform: scale(1.005); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .custom-table td {
            padding: 15px;
            color: #555;
            vertical-align: middle;
            border-top: 1px solid #f1f1f1;
            border-bottom: 1px solid #f1f1f1;
        }
        .btn-delete {
            color: #ff5252;
            background: #ffebee;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-delete:hover { background: #ff5252; color: white; }
    </style>

    <div class="admin-card">
        <div class="page-title">
            <i class="fas fa-list"></i> Quản lý danh mục
        </div>
        
        <form th:action="@{/admin/categories/save}" method="post" class="custom-form">
            <input type="text" name="name" class="custom-input" placeholder="Nhập tên danh mục mới..." required>
            <button type="submit" class="btn-add">
                <i class="fas fa-plus"></i> Thêm danh mục
            </button>
        </form>

        <table class="custom-table">
            <thead>
                <tr>
                    <th width="10%">ID</th>
                    <th width="60%">Tên danh mục</th>
                    <th width="30%" style="text-align: center;">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${'#' + cat.id}" style="font-weight: bold; color: #999;"></td>
                    <td>
                        <span th:text="${cat.name}" style="font-weight: 600; color: #2c3e50;"></span>
                    </td>
                    <td style="text-align: center;">
                        <a th:href="@{'/admin/categories/delete/' + ${cat.id}}" 
                           class="btn-delete"
                           onclick="return confirm('Xóa danh mục này có thể ảnh hưởng đến sản phẩm. Bạn chắc chứ?')">
                           <i class="fas fa-trash-alt"></i> Xóa
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
