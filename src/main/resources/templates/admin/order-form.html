<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{admin/layout :: main-layout(~{::section})}">
<body>
<section>
    <div class="card">
        <h2><i class="fas fa-file-invoice"></i> Chi tiết đơn hàng #<span th:text="${order.id}"></span></h2>
        <hr>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; margin-top: 20px;">
            <div>
                <h4 style="color: var(--sidebar-bg); margin-bottom: 10px;">Thông tin giao hàng</h4>
                <p><strong>Người nhận:</strong> <span th:text="${order.receiverName}"></span></p>
                <p><strong>Số điện thoại:</strong> <span th:text="${order.receiverPhone}"></span></p>
                <p><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                <p><strong>Tài khoản đặt:</strong> <span th:text="${order.user.username}"></span></p>
            </div>
            <div style="text-align: right;">
                <h4 style="color: var(--sidebar-bg); margin-bottom: 10px;">Trạng thái đơn hàng</h4>
                <form th:action="@{/admin/orders/update-status}" method="post">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <select name="status" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd; outline: none;">
                        <option value="PENDING" th:selected="${order.status == 'PENDING'}">Chờ xử lý</option>
                        <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">Đang giao hàng</option>
                        <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">Đã giao hàng</option>
                        <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Đã hủy</option>
                    </select>
                    <button type="submit" style="background: var(--accent); color: white; border: none; padding: 9px 15px; border-radius: 5px; cursor: pointer;">Cập nhật</button>
                </form>
            </div>
        </div>

        <h4 style="margin-bottom: 15px;">Sản phẩm trong đơn hàng</h4>
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f8f9fa; border-bottom: 2px solid #eee;">
                    <th style="padding: 12px; text-align: left;">Sản phẩm</th>
                    <th style="padding: 12px; text-align: center;">Số lượng</th>
                    <th style="padding: 12px; text-align: right;">Đơn giá</th>
                    <th style="padding: 12px; text-align: right;">Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.items}" style="border-bottom: 1px solid #eee;">
                    <td style="padding: 12px;">
                        <img th:src="@{'/images/' + ${item.product.imageUrl}}" width="45" style="vertical-align: middle; border-radius: 4px; margin-right: 10px;">
                        <span th:text="${item.product.name}"></span>
                    </td>
                    <td style="padding: 12px; text-align: center;" th:text="${item.quantity}"></td>
                    <td style="padding: 12px; text-align: right;" 
                        th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                    <td style="padding: 12px; text-align: right; font-weight: bold;" 
                        th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" style="padding: 20px; text-align: right; font-weight: bold; font-size: 1.1rem;">Tổng thanh toán:</td>
                    <td style="padding: 20px; text-align: right; font-weight: bold; font-size: 1.3rem; color: var(--accent);" 
                        th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}"></td>
                </tr>
            </tfoot>
        </table>
        
        <div style="margin-top: 30px;">
            <a th:href="@{/admin/orders}" style="color: #666; text-decoration: none;">
                <i class="fas fa-chevron-left"></i> Quay lại danh sách đơn hàng
            </a>
        </div>
    </div>
</section>
</body>
</html>
